function tripPlan(to){const from=anchor().x!=null?anchor():station();const r1=Math.hypot(from.x,from.y),r2=Math.hypot(to.x,to.y),v=Math.sqrt(MU/r1);

 const phi=wrap(Math.atan2(from.y,from.x)-Math.atan2(to.y,to.x));const N=Math.min(6,Math.max(1,Math.ceil(Math.abs(phi)/0.12)));
 const dvP=v*Math.abs(phi)/(3*Math.PI*N)*1000;const di=Math.abs((to.inc||51.6)-(from.inc||51.6));const dvI=2*v*Math.sin(di*DEG/2)*1000;

 return{dvH,dvP,dvI,dv,N,phi,di,time,fuel:tripFuel(dv),dist:Math.hypot(to.x-from.x,to.y-from.y)}}

 if(p.dvP>=p.dvH){const d=p.phi>0?-1:1;return[d,-d]}const d=up?1:-1;return[d,d]}
